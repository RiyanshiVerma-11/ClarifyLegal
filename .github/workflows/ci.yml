name: ClarifyLegal CI & Evaluation Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  evaluate-and-test:
    name: Code Quality, Security, Efficiency & Testing Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Code Quality & Type Safety Audit
        run: npm run lint

      - name: Security & Full Unit Test Suite with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Production Bundle & Server Build Verification
        run: npm run build
